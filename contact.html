<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; line-height: 1.6; }
        header, footer { background: #222; color: white; padding: 20px; text-align: center; }
        nav { background: #444; padding: 12px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; }
        main { max-width: 700px; margin: auto; padding: 30px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0 15px; box-sizing: border-box; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>
    <header>
        <h1>Contact Me</h1>
        <p>Let's connect!</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section>
            <h2>Send Me a Message</h2>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject">

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="7" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section>
            <h2>Other Links</h2>
            <p><a href="https://github.com/" target="_blank" rel="noopener noreferrer">My GitHub</a></p>
            <p><a href="mailto:student@example.com">Email Me</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rohit Bhattarai</p>
    </footer>
</body>
</html>
