<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohit Bhattarai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .navbar {
            width: 100%;
            background-color: #333333;
            border-radius: 10px;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 40px;
        }

        .nav-logo {
            position: absolute;
            left: 38%;
            display: flex;
            align-items: center;
        }

        .nav-logo img {
            height: 20px;
            margin-right: 5px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: #0000ff;
            text-decoration: underline;
            font-size: 16px;
        }
        .card {
            background-color: #cccccc;
            border: 2px solid #000000;
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
            text-align: center;
        }
        .card h1 {
            color: #00008b;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .photo-container {
            margin: 0 auto 20px auto;
            display: inline-block;
        }

        .photo-container img {
            border: 1px solid #000000;
            max-width: 120px;
            height: auto;
            display: block;
        }
        .card h2 {
            color: #008000;
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .card p {
            font-size: 16px;
            color: #000000;
            line-height: 1.3;
            max-width: 380px;
            margin: 0 auto 15px auto;
        }
        .skills-list {
            text-align: left;
            display: inline-block;
            margin-bottom: 15px;
        }

        .skills-list ul {
            list-style-type: disc;
            padding-left: 20px;
        }

        .skills-list li {
            font-size: 16px;
            color: #000000;
            margin-bottom: 3px;
        }

        .card a.website-link {
            color: #0000ff;
            text-decoration: underline;
            font-size: 18px;
            display: inline-block;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-logo">
            <img src="logo.png" alt="Logo">
        </div>
        <div class="nav-links">
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#website">Website</a>
        </div>
    </div>
    <div class="card">
        <h1>Rohit Bhattarai</h1>

        <div class="photo-container">
            <img src="student.jpg" alt="Student Photo">
        </div>

        <h2 id="about">About Me</h2>
        <p>Hello! My name is Rohit Bhattarai. I am a computer science student and I am learning HTML, CSS and JavaScript.</p>

        <h2 id="skills">My Skills</h2>
        <div class="skills-list">
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>C#</li>
            </ul>
        </div>

        <h2 id="website">My Website</h2>
        <a href="#" class="website-link">Visit My Website</a>
    </div>

</body>
</html>
